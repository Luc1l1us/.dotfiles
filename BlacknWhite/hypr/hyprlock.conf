general {
    hide_cursor = true
    immediate_render = true
  }

background {
    monitor =
    path = ~/.dotfiles/BlacknWhite/Wallpaper/bw_1.jpeg
    blur_passes = 2
  }

label {
    text = cmd[update:1000] echo "<span>$(date '+%A %d, %Y, %p ')</span>"
    color = rgba(255,255,255,1)
    font_size = 15
    position = 0, 350
    halign = center
    valign = center
  }

label {
    text = cmd[update:1000] echo "<span>$(date '+%H:%M')</span>"
    color = rgba(255,255,255,1)
    font_size = 40
    position = 0, 300
    halign = center
    valign = center
  }

image {
    monitor = 
    path = ~/.dotfiles/BlacknWhite/pfp/22b(bw).png
    border_color = 0xffdddddd
    border_size = = 1
    rounding = -1
    size = 90
    position = 0, -30%
    halign = center
    valign = center
  }

input-field {
    monitor = 
    placeholder_text = "Enter password"
    size = 90, 30
    outline_thickness = 0
    dots_size=0.2
    position = 0, -450
    fade_on_empty = true
  }

label {
    text = $USER
    color = rgba(255,255,255,1)
    font_size = 15
    font_family= Caskaydia 
    position = 0, -400
    halign = center
    valign = center
  }

## UPPER RIGHT OF HYRPLOCK
label {
    text = $LAYOUT
    color = rgba(255,255,255,1)
    font_size = 10
    font_family= Caskaydia 
    position = -100, -6
    halign = right
    valign = top
  }


 label { 
     # text = echo "$( sh ~/.config/hypr/hyprland/scripts/kb_layout.sh)"
     text = cmd[update:3000] echo "$( sh ~/.config/hypr/hyprland/scripts/kb_layout.sh)"
     color = rgba(255,255,255,1)
     font_size = 22
     font_family= Caskaydia 
     position = -180, 8
     halign = right
     valign = top
   }



label { 
    text = cmd[update:1000] echo "$( sh ~/.config/hypr/hyprland/scripts/network-status.sh)"
    color = rgba(255,255,255,1)
    font_size = 15
    font_family= Caskaydia 
    position = -230, 0
    halign = right
    valign = top
  }

label { 
    text = cmd[update:300000] sh ~/.config/hypr/hyprland/scripts/weather.sh 
    color = rgba(255,255,255,1)
    font_size = 15
    font_family= Caskaydia 
    position = 0, 250
    halign = center
    valign = center
  }

