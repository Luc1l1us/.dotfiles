<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Clock</title>
    <style>
        :root {
            --font-size: 25.2px;
            --gap: 56px;
            --clock-size: 140px;
            --hand-width: 2.8px;
            --switch-size: 84px;
            --switch-height: 42px;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: var(--font-size);
            line-height: 1.5;
            transition: background 0.5s, color 0.5s;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
        }

        .container {
            display: flex;
            align-items: center;
            gap: var(--gap);
            /* erase animation property to erase glitch effect */
            animation: glitch 3s infinite alternate;
        }

        .code { color: #569cd6; }
        .number { color: #dcdcaa; }
        .string { color: #ce9178; }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animated-background-dark {
            background: linear-gradient(135deg, #1e1e1e ,#342f44, #4f4369);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
        }

        .animated-background-light {
            background: linear-gradient(135deg, #f0f0f0, #d3d3d3, #ffffff);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite;
        }
        
        .analog-clock {
            width: var(--clock-size);
            height: var(--clock-size);
            border: var(--hand-width) solid;
            border-radius: 50%;
            position: relative;
            animation: rotatingShadow 3s linear infinite, glitch 3s infinite alternate; 
            /* remove or replace with box-shadow: 0px 0px 20px #f7b398;
            animation: rotatingShadow 3s infinite alternate, glitch 3s infinite alternate; 
            animation: rotatingShadow 3s linear infinite, glitch 3s infinite alternate; 
            */           
        }

        @keyframes gradientHand {
            0%, 100% {background: #6eccee;}
            25% {background: #f672ca;}
            50% {background: #6eccee;}
            75% {background: #f672ca;}
        }

        @keyframes rotatingShadow {
            0%, 100% { box-shadow: 0px 0px 10px #6eccee; }
            25% { box-shadow: 5px 5px 20px #f672ca;}
            50% { box-shadow: 0px 0px 30px #6eccee;}
            75% { box-shadow: -5px -5px 20px #f672ca;}        
        }

        /* glitch effect */
        @keyframes glitch {
            from {
                --angle: 45deg;
                transform: translateY(-0vh);
            }

            49.5% {
                --angle: 45deg;
                transform: translateY(-1vh);
                filter: brightness(100%);
            }
            50% {
                --angle: 360deg;
                transform: translateY(-1vh) scaleY(0.1) skewX(253deg);
                filter: brightness(190%);
            }

            51% {
                --angle: 360deg;
                transform: translateY(-1vh) scaleY(0.5) skewX(37deg);
                filter: brightness(190%);
            }

            52% {
                --angle: 360deg;
                filter: brightness(190%);
                transform: translateY(-0vh);
            }

            to {
                --angle: 45deg;
                transform: translateY(-0vh);
            }
        }
        
        .hand {
            position: absolute;
            background: currentColor;
            transform-origin: bottom center;
        }

        .hour-hand { width: 5.6px; height: 42px; top: 28px; left: 67.2px; }
        .minute-hand { width: 4.2px; height: 56px; top: 14px; left: 67.9px; }
        .second-hand { 
            width: 2.8px; 
            height: 63px; 
            top: 7px; 
            left: 68.6px; 
            animation: gradientHand 3s linear infinite
            /* remove or replace with 
            background: #f7b398;
            this to reduce CPU usage 
            animation: gradientHand 3s linear infinite
            */      
        }

        /* Центральная точка */
        .center-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff; /* Белая точка по умолчанию для тёмной темы */
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: background 0.5s;
        }

        /* Для светлой темы точка становится чёрной */
        .animated-background-light .center-dot {
            background: #000;
        }

        .theme-switch {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .theme-switch label { font-size: var(--font-size); color: inherit; }
        .theme-switch input[type="checkbox"] {
            appearance: none;
            width: var(--switch-size);
            height: var(--switch-height);
            background: #463865;
            border-radius: 21px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            border: 0.1px solid #2d293b;
        }

        .theme-switch input[type="checkbox"]:hover {
            appearance: none;
            width: var(--switch-size);
            height: var(--switch-height);
            background: #271f38;
            border-radius: 21px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            border: 0.1px solid #2d293b;
        }

        .theme-switch input[type="checkbox"]::before {
            content: '🌙';
            position: absolute;
            width: 38px;
            height: 38px;
            background: #1e1e1e;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s, content 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .theme-switch input[type="checkbox"]:checked::before {
            content: '☀️';
            transform: translateX(42px); /* 42 */
            background: #f0f0f0;
        }

        .theme-switch input[type="checkbox"]:checked:hover { 
            background: #271f38;
        }
        
    </style>
</head>
<body class="animated-background-dark">
    <div class="container">
        <pre id="code"></pre>
        <div class="analog-clock">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <!-- Центральная точка -->
            <div class="center-dot"></div>
        </div>
    </div>

    <!-- Переключатель темы -->
    <div class="theme-switch">
        <label for="theme-toggle"></label>
        <input type="checkbox" id="theme-toggle" onclick="toggleTheme()">
    </div>

    <script>
        // Функция для обновления времени
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dayOfWeek = now.toLocaleString('en', { weekday: 'long' });
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

            // Прогресс дня в процентах
            const startOfDay = new Date(now);
            startOfDay.setHours(0, 0, 0, 0);
            const progress = ((now - startOfDay) / 86400000) * 100;

            // Определяем цвет чисел в зависимости от темы
            const isDarkTheme = document.body.classList.contains('animated-background-dark');
            const numberColor = isDarkTheme ? '#dcdcaa' : '#1e3a8a';            // Форматируем текст как код
            const codeString = `
                <span class="code">const</span> currentTime = {
                    <span class="code">timeZone</span>: <span class="string" style="color: ${dayOfWeek}">${timezone}</span>,
                    <span class="code">year</span>: <span class="number" style="color: ${numberColor}">${year}</span>,
                    <span class="code">month</span>: <span class="number" style="color: ${numberColor}">${month}</span>,
                    <span class="code">day</span>: <span class="number" style="color: ${numberColor}">${day}</span>,
                    <span class="code">dayOfWeek</span>: <span class="string">"${dayOfWeek}"</span>,
                    <span class="code">hour</span>: <span class="number" style="color: ${numberColor}">${hours}</span>,
                    <span class="code">minute</span>: <span class="number" style="color: ${numberColor}">${minutes}</span>,
                    <span class="code">second</span>: <span class="number" style="color: ${numberColor}">${seconds}</span>,
                    <span class="code">dayProgress</span>: <span class="number" style="color: ${numberColor}">${progress.toFixed(2)}%</span>
                };
            `;

            document.getElementById('code').innerHTML = codeString;

            // Анимация аналоговых часов
            const hourHand = document.querySelector('.hour-hand');
            const minuteHand = document.querySelector('.minute-hand');
            const secondHand = document.querySelector('.second-hand');

            const hourDeg = (now.getHours() % 12) * 30 + (now.getMinutes() * 0.5);
            const minuteDeg = now.getMinutes() * 6 + (now.getSeconds() * 0.1);
            const secondDeg = now.getSeconds() * 6;

            hourHand.style.transform = `rotate(${hourDeg}deg)`;
            minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
            secondHand.style.transform = `rotate(${secondDeg}deg)`;
        }

        // Смена темы
        function toggleTheme() {
            const body = document.body;
            const isDark = body.classList.contains('animated-background-dark');

            if (isDark) {
                body.classList.remove('animated-background-dark');
                body.classList.add('animated-background-light');
                body.style.color = '#1e1e1e';
            } else {
                body.classList.remove('animated-background-light');
                body.classList.add('animated-background-dark');
                body.style.color = '#d4d4d4';
            }

            // Обновляем время, чтобы применить новый цвет чисел
            updateTime();
        }

        // Обновляем время каждую секунду
        setInterval(updateTime, 1000);
        updateTime(); // Инициализация сразу
    </script>
</body>
</html>
